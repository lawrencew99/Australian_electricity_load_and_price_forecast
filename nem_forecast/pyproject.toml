[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nem_forecast"
version = "0.1.0"
description = "NEM regional load & RRP forecasting scaffold (AEMO-oriented)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24,<2",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
